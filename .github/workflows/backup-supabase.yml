# Copia de seguridad diaria de los datos de usuario de Supabase (plan gratuito, sin backups propios).
#
# · Vuelca el esquema public completo con sus datos (progreso, reportes, resultados, marcas,
#   objetivos, diario, uso_api y también banco_preguntas, que hace falta para que las claves
#   ajenas de progreso/reportes se puedan restaurar) y las cuentas (auth.users, auth.identities),
#   para que el progreso siga ligado a cada usuario si hay que restaurar en un proyecto nuevo.
# · El repo es PÚBLICO: el volcado se cifra (AES-256, gpg) ANTES de subirlo como artifact.
#   Sin BACKUP_PASSPHRASE nadie puede leerlo. No imprimir nunca datos en el log.
# · Efecto secundario útil: la conexión diaria evita que Supabase pause el proyecto por inactividad.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     cadena del «Session pooler» (Supabase → Connect), con la contraseña de la BD
#   BACKUP_PASSPHRASE   contraseña larga para cifrar; guárdala también fuera de GitHub
#
# Restaurar: ver docs/BACKUPS.md

name: Backup Supabase

on:
  schedule:
    - cron: "17 2 * * *"   # todos los días a las 02:17 UTC (03:17 / 04:17 en Zaragoza)
  workflow_dispatch: {}     # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Falta el secret BACKUP_PASSPHRASE"; exit 1; }

      # El servidor es Postgres 17: pg_dump tiene que ser de la misma versión o superior
      - name: Instalar pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcar base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          # La URL se separa en variables PG* para que la contraseña NUNCA vaya en la línea de conexión:
          # si pg_dump falla, su error solo muestra host y usuario. Se corta por la ÚLTIMA «@», así que
          # funciona aunque la contraseña lleve «@» u otros símbolos sin codificar.
          eval "$(python3 - <<'PY'
          import os, shlex, urllib.parse as up
          url = os.environ["SUPABASE_DB_URL"].strip()
          esquema, _, resto = url.partition("://")
          if esquema not in ("postgres", "postgresql") or "@" not in resto:
              print('echo "::error::SUPABASE_DB_URL no tiene el formato postgresql://usuario:contraseña@host:puerto/base"; exit 1')
              raise SystemExit
          cred, _, hostpart = resto.rpartition("@")
          usuario, _, clave = cred.partition(":")
          hostport, _, base = hostpart.partition("/")
          host, _, puerto = hostport.partition(":")
          clave = up.unquote(clave)
          for v in {clave, cred}:
              if v:
                  print(f"echo {shlex.quote('::add-mask::' + v)}")
          env = {"PGHOST": host, "PGPORT": puerto or "5432", "PGDATABASE": (base.split("?")[0] or "postgres"),
                 "PGUSER": up.unquote(usuario), "PGPASSWORD": clave, "PGSSLMODE": "require"}
          for k, v in env.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          )"
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          mkdir -p dump
          # 1) esquema public completo con todos sus datos
          $PGD --schema=public --no-owner --no-privileges --file=dump/public.sql
          # el schema public ya existe en cualquier proyecto de Supabase: quitar su CREATE para restaurar sin errores
          sed -i '/^CREATE SCHEMA public;$/d' dump/public.sql
          # 2) cuentas de usuario (solo datos: el esquema auth lo crea Supabase)
          $PGD --data-only --no-owner --no-privileges \
            --table=auth.users --table=auth.identities \
            --file=dump/auth.sql
          # comprobación mínima: que estén las tablas clave (sin mostrar contenido)
          grep -q "COPY public.progreso" dump/public.sql
          grep -q "COPY public.banco_preguntas" dump/public.sql
          grep -q "COPY public.reportes_preguntas" dump/public.sql
          grep -q "COPY auth.users" dump/auth.sql
          echo "Tamaños:"; du -h dump/*

      - name: Cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          NOMBRE="backup-$(date -u +%Y-%m-%d)"
          tar -czf "$NOMBRE.tar.gz" -C dump .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$NOMBRE.tar.gz.gpg" "$NOMBRE.tar.gz" <<< "$BACKUP_PASSPHRASE"
          # borrar todo lo que esté en claro antes de subir nada
          shred -u "$NOMBRE.tar.gz" dump/*.sql
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"
          ls -lh "$NOMBRE.tar.gz.gpg"

      - name: Guardar copia cifrada
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: ${{ env.NOMBRE }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
